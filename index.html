<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <i class="fas fa-quote-left"></i>
                Quote of the Day
                <i class="fas fa-quote-right"></i>
            </h1>
            <p class="subtitle">Discover daily inspiration and wisdom</p>
        </header>

        <main class="main-content">
            <div class="quote-container">
                <div class="quote-card">
                    <div class="quote-content">
                        <blockquote class="quote-text" id="quoteText">
                            Loading your daily inspiration...
                        </blockquote>
                        <cite class="quote-author" id="quoteAuthor">
                            
                        </cite>
                    </div>
                    
                    <div class="quote-actions">
                        <button class="btn btn-primary" id="newQuoteBtn">
                            <i class="fas fa-refresh"></i>
                            New Quote
                        </button>
                        <button class="btn btn-secondary" id="shareBtn">
                            <i class="fas fa-share"></i>
                            Share
                        </button>
                        <button class="btn btn-secondary" id="favoriteBtn">
                            <i class="far fa-heart"></i>
                            Favorite
                        </button>
                    </div>
                </div>
            </div>

            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-number" id="quotesViewed">0</div>
                    <div class="stat-label">Quotes Viewed Today</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="favoriteCount">0</div>
                    <div class="stat-label">Favorites</div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 Quote of the Day. Spreading inspiration, one quote at a time.</p>
        </footer>
    </div>

    <!-- Share Modal -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Share This Quote</h3>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="share-options">
                    <button class="share-btn twitter" id="shareTwitter">
                        <i class="fab fa-twitter"></i>
                        Twitter
                    </button>
                    <button class="share-btn facebook" id="shareFacebook">
                        <i class="fab fa-facebook"></i>
                        Facebook
                    </button>
                    <button class="share-btn copy" id="copyQuote">
                        <i class="fas fa-copy"></i>
                        Copy Text
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
